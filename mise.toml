[settings]
python.precompiled_flavor = "install_only_stripped"
experimental = true
lockfile = true
minimum_release_age = "7d"
idiomatic_version_file_enable_tools = ["rust"]

[env]
_.path = ["node_modules/.bin"]

[tools]
actionlint = "1.7.12"
dprint = "0.55.2"
git-cliff = "2.13.1"
hadolint = "2.15.1"
k3d = "5.9.0"
kubectl = "1.36.3"
ruff = "0.16.2"
shellcheck = "0.11.0"
tilt = "0.37.6"
trufflehog = "3.96.0"
zizmor = "1.29.0"
node = { version = "24.19.0", postinstall = "npm install --include dev" }
python = "3.14.7"
uv = "0.12.3"
buildifier = "8.5.1"
k6 = "2.1.0"
prek = "0.4.12"
vale = "3.17.1"
