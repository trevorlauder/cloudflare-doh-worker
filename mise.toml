[settings]
python.precompiled_flavor = "install_only_stripped"
experimental = true
lockfile = true
minimum_release_age = "7d"
idiomatic_version_file_enable_tools = ["rust"]

[env]
_.path = ["node_modules/.bin"]

[tools]
actionlint = "1.7.12"
dprint = "0.57.4"
git-cliff = "2.14.2"
hadolint = "2.15.1"
k3d = "5.9.0"
kubectl = "1.37.1"
ruff = "0.16.9"
shellcheck = "0.11.0"
tilt = "0.37.7"
trufflehog = "v3.97.9"
zizmor = "1.30.1"
node = { version = "24.21.0", postinstall = "npm install --include dev" }
python = "3.14.7"
uv = "0.12.19"
buildifier = "8.5.1"
k6 = "2.3.0"
prek = "0.5.3"
vale = "3.23.0"
